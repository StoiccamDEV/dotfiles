# Alacritty Config - Gruvbox Minimal (TOML Format)

[window]
padding.x = 10
padding.y = 10
decorations = "Full" # Puedes poner "None" para quitar barra de título
# opacity = 0.95 # Descomenta para ligera transparencia
startup_mode = "Windowed" # Maximized, Fullscreen

[scrolling]
history = 5000
multiplier = 3

[font]
normal.family = "JetBrainsMono Nerd Font"
# normal.family = "monospace" # Alternativa si no tienes Nerd Font
# style = "Regular"
size = 11.0

bold.family = "JetBrainsMono Nerd Font"
# bold.family = "monospace"
# style = "Bold"

italic.family = "JetBrainsMono Nerd Font"
# italic.family = "monospace"
# style = "Italic"

bold_italic.family = "JetBrainsMono Nerd Font"
# bold_italic.family = "monospace"
# style = "Bold Italic"

# Gruvbox Material Dark color scheme
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#fabd2f" # yellow

[colors.selection]
text = "#282828"
background = "#fabd2f" # yellow

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    # Scroll con Shift + PageUp/PageDown
    { key = "PageUp",   mods = "Shift",   action = "ScrollPageUp",   mode = "~Vi" },
    { key = "PageDown", mods = "Shift",   action = "ScrollPageDown", mode = "~Vi" },
    # Ir al principio/final con Shift + Home/End
    { key = "Home",     mods = "Shift",   action = "ScrollToTop",    mode = "~Vi" },
    { key = "End",      mods = "Shift",   action = "ScrollToBottom", mode = "~Vi" },
]

# Shell (Opcional, si no quieres usar el default de tu sistema)
# [shell]
# program = "/bin/zsh"
# args = ["-l"]
