# ================================= #
# Hyprland Config - Gruvbox Minimal #
# ================================= #

# ---------------- Monitor -----------------
# Reemplaza eDP-1 con tu salida si es diferente (usa `hyprctl monitors`)
monitor=,preferred,1920x1080@120,1.2

# ------------- Autostart ---------------
# Importante para D-Bus y servicios de usuario
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = /usr/lib/polkit-kde-authentication-agent-1 # Agente de autenticación
exec-once = waybar                                   # Barra de estado
exec-once = mako                                     # Demonio de notificaciones
exec-once = swww init                                # Inicializar gestor de fondos
exec-once = sleep 1 && swww img ~/Pictures/Wallpapers/gruvbox-wallpaper.png --transition-type grow --transition-pos 0.85,0.95 --transition-step 90 # Establecer fondo (con delay)
exec-once = nm-applet --indicator                    # Applet de NetworkManager en la bandeja
exec-once = cliphist wipe && cliphist store          # Inicia historial del portapapeles

# ------------- Environment Variables -------------
env = XCURSOR_SIZE,24
env = GTK_THEME,Gruvbox-Material-Dark
env = QT_QPA_PLATFORMTHEME,qt6ct # O qt6ct si prefieres Qt6
# env = LIBVA_DRIVER_NAME,nvidia # Descomentar para Nvidia si usas VAAPI
# env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm   # Descomentar para Nvidia (GBM)
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia # Descomentar para Nvidia
# env = WLR_NO_HARDWARE_CURSORS,1 # Descomentar si hay problemas de cursor con Nvidia

# ------------- Input -------------
input {
    kb_layout = latam # Cambia 'us' a tu distribución (e.g., es, latam, gb)
    kb_variant =
    kb_model =
    kb_options = numpad:microsoft # Ejemplo: Bloq Num se comporta como en Windows
    kb_rules =

    follow_mouse = 1 # Foco sigue al ratón

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 significa sin modificación.
}

# ------------- General -------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Gruvbox Material Dark Colors
    col.active_border = rgba(fabd2fcc) rgba(ebdbb2cc) 45deg # Yellow -> Fg
    col.inactive_border = rgba(504945aa) # bg2 con transparencia

    layout = dwindle # master, dwindle
}

# ------------- Decoration -------------
decoration {
    rounding = 8 # Radio de borde más suave
    # Blur 
    blur {
        enabled = yes
        size = 5
        passes = 2
        new_optimizations = on
    }

    # Opacity
    active_opacity = 0.96
    inactive_opacity = 0.92

    # drop_shadow = yes
    # shadow_range = 10 # Sombra más difusa
    # shadow_render_power = 3
    # col.shadow = rgba(26, 24, 24, 0.5) # Sombra oscura #1a1818 con 50% opacidad
    # col.shadow_inactive = rgba(26, 24, 24, 0.3) # Sombra inactiva más tenue
}

# ------------- Animations -------------
animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = slide, 0.4, 1.1, 0.1, 1.0 # Curva más elástica
    animation = windows, 1, 7, wind
    animation = windowsOut, 1, 7, slide, popin 60% # Salida con popin
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, slide # Animación de workspace más suave
}

# ------------- Layouts -------------
dwindle {
    pseudotile = yes
    preserve_split = yes
    force_split = 0 # 0: Inteligente, 1: Siempre a la derecha, 2: Siempre abajo
}

# master {
#    new_is_master = true
# }

gestures {
    workspace_swipe = on # Habilitar swipe entre workspaces
    workspace_swipe_fingers = 3 # Usar 3 dedos
}

# ------------- Window Rules -------------
windowrulev2 = float, class:^(org\.kde\.polkit-kde-authentication-agent-1)$ # Agente Polkit flotante
windowrulev2 = float, class:^(pavucontrol)$ # Pavucontrol flotante
windowrulev2 = float, title:^(Abrir Archivo)$ # Diálogos de abrir archivo flotantes
windowrulev2 = float, title:^(Guardar Archivo)$ # Diálogos de guardar archivo flotantes
windowrulev2 = float, class:^(org.gnome.Nautilus)${title:^(Propiedades)}$ # Propiedades de Nautilus flotante
windowrulev2 = float, class:^(blueman-manager)$ # Blueman flotante
windowrulev2 = idleinhibit focus, class:^(mpv)$ # Evitar que mpv entre en idle
windowrulev2 = size 80% 80%, class:^(org.gnome.Nautilus)$ # Tamaño inicial de Nautilus


# ------------- Keybinds -------------
$mainMod = SUPER # Tecla Windows/Super

# --- Aplicaciones ---
bind = $mainMod, RETURN, exec, alacritty # Terminal (Alacritty)
bind = $mainMod, D, exec, rofi -show drun -theme ~/.config/rofi/config.rasi # Lanzador de aplicaciones (drun)
bind = $mainMod, E, exec, nautilus # Gestor de Archivos (Nautilus)
bind = $mainMod, Q, killactive, # Cerrar ventana activa
bind = $mainMod, M, exit, # Salir de Hyprland (logout)

# --- Movimiento y Gestión de Ventanas ---
bind = $mainMod, SPACE, togglefloating, # Ventana flotante/tiling
bind = $mainMod, P, pseudo, # Toggle pseudotiling
bind = $mainMod, J, togglesplit, # Cambia split en dwindle layout
bind = $mainMod, F, fullscreen, # Pantalla completa (0: normal, 1: maximizado)

# Mover foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l # Alternativa estilo Vim
bind = $mainMod, L, movefocus, r # Alternativa estilo Vim
bind = $mainMod, K, movefocus, u # Alternativa estilo Vim
bind = $mainMod, J, movefocus, d # Alternativa estilo Vim (OJO: Sobrescribe togglesplit si no se usa SHIFT)

# Cambiar a workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mover ventana activa a workspace silenciosamente (sin cambiar el foco)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
# ... etc para otros workspaces si lo necesitas ...

# Scroll workspaces con rueda del ratón sobre una zona vacía
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover/Redimensionar ventanas con ratón + MOD
bindm = $mainMod, mouse:272, movewindow   # Botón izquierdo para mover
bindm = $mainMod, mouse:273, resizewindow # Botón derecho para redimensionar

# --- Controles Multimedia y Sistema ---
# Volumen (usa pamixer + dunstify para feedback)
binde =, XF86AudioRaiseVolume, exec, pamixer -i 5 && pamixer --get-volume-human | xargs -I {} dunstify -r 1001 -h int:value:{} "Volumen" -t 1000
binde =, XF86AudioLowerVolume, exec, pamixer -d 5 && pamixer --get-volume-human | xargs -I {} dunstify -r 1001 -h int:value:{} "Volumen" -t 1000
bind =, XF86AudioMute, exec, pamixer -t && pamixer --get-mute | xargs -I {} dunstify -r 1002 "Silencio: {}" -t 1000

# Brillo (usa brightnessctl + dunstify para feedback)
binde =, XF86MonBrightnessUp, exec, brightnessctl set +5% && brightnessctl get | xargs -I {} dunstify -r 1003 -h int:value:{} "Brillo" -t 1000
binde =, XF86MonBrightnessDown, exec, brightnessctl set 5%- && brightnessctl get | xargs -I {} dunstify -r 1003 -h int:value:{} "Brillo" -t 1000

# Controles de Reproducción (usa playerctl)
bind =, XF86AudioPlay, exec, playerctl play-pause
bind =, XF86AudioNext, exec, playerctl next
bind =, XF86AudioPrev, exec, playerctl previous

# --- Capturas de Pantalla (usa grim/slurp/swappy) ---
bind = , Print, exec, grim - | swappy -f - # Captura pantalla completa y abre en swappy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f - # Captura área seleccionada y abre en swappy
# Alternativa para guardar directamente:
# bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S_grim.png') && notify-send "Screenshot guardado"
# bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S_slurp.png') && notify-send "Screenshot de área guardado"

# --- Portapapeles (usa cliphist/rofi) ---
bind = $mainMod, V, exec, rofi -modi "clipboard:cliphist list | cliphist decode" -show clipboard -run-command '{cmd}'

# --- Menú de Apagado/Reinicio (Simple con Rofi) ---
bind = $mainMod, X, exec, rofi -show p -modi p:~/.config/hypr/rofi-powermenu.sh # Requiere script rofi-powermenu.sh

# --- Ciclar entre ventanas del workspace actual ---
# bind = $mainMod, Tab, cyclenext
# bind = $mainMod SHIFT, Tab, cyclenext, prev
